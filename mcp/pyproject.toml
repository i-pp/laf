[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-fabric-mcp"
version = "0.1.0"
description = "Owner-only local LAF Router-job MCP stdio interface"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-KOL-v1"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/MCP-SDK-LICENSE.txt"]
# Modified 2026-11-11: exact SDK 1.30.0 selection; no automatic installation.
dependencies = ["mcp==1.30.0"]

[project.scripts]
laf-mcp = "laf_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
