# Added 2026-11-12: always-run, offline minimum CI; not hardware or release acceptance.

name: Minimum source CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minimum:
    name: Minimum source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked Python, JSON and shell syntax
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import ast
          import json
          import pathlib
          import subprocess

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          checked = 0
          for name in filter(None, paths):
              path = pathlib.Path(name)
              if path.suffix == '.py':
                  ast.parse(path.read_bytes(), filename=name)
              elif path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
              elif path.suffix == '.sh':
                  subprocess.run(['bash', '-n', name], check=True)
              else:
                  continue
              checked += 1
          if not checked:
              raise SystemExit('No source files checked')
          print(f'Syntax checked: {checked} files')
          PYCODE
      - name: Run full offline Python regressions, including Unix sockets
        run: python3 -B scripts/check-laf.py --suite full
      - name: Validate the local stdio plugin source boundary
        run: python3 -B scripts/check-laf-plugin.py
      - name: Run MCP source safety checks without installing an SDK
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: mcp/src:mcp/tests
        run: |
          python3 -B - <<'PYCODE'
          import json
          import unittest

          SCOPE = 'MCP source/mock/manifest only; excludes actual SDK and package builds'
          names = ['test_application', 'test_attempts', 'test_contracts',
                   'test_receipts', 'test_router', 'test_sdk_gate',
                   'test_integrated_router.IntegratedApplicationTests',
                   'test_package.PackageTests.test_manifest']
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)

          def cases(group):
              for item in group:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item

          ids = [case.id() for case in cases(suite)]
          planned = len(ids)
          if not planned or len(set(ids)) != planned:
              raise SystemExit('Empty or duplicate selected tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = (result.wasSuccessful() and result.testsRun == planned
                    and not result.skipped and not result.expectedFailures
                    and not result.unexpectedSuccesses)
          print(json.dumps({'scope': SCOPE, 'planned': planned,
                            'run': result.testsRun, 'failures': len(result.failures),
                            'errors': len(result.errors), 'skipped': len(result.skipped),
                            'expected_failures': len(result.expectedFailures),
                            'unexpected_successes': len(result.unexpectedSuccesses),
                            'passed': passed}, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PYCODE
      - name: Run SDK installer regressions without installing the SDK
        run: |
          python3 -B - <<'PYCODE'
          import json
          import unittest

          SCOPE = 'SDK installer regressions only; no SDK acquisition or install'
          suite = unittest.defaultTestLoader.discover('scripts', pattern='test_sdk_installer.py')

          def cases(group):
              for item in group:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item

          ids = [case.id() for case in cases(suite)]
          planned = len(ids)
          if not planned or len(set(ids)) != planned:
              raise SystemExit('Empty or duplicate selected tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = (result.wasSuccessful() and result.testsRun == planned
                    and not result.skipped and not result.expectedFailures
                    and not result.unexpectedSuccesses)
          print(json.dumps({'scope': SCOPE, 'planned': planned,
                            'run': result.testsRun, 'failures': len(result.failures),
                            'errors': len(result.errors), 'skipped': len(result.skipped),
                            'expected_failures': len(result.expectedFailures),
                            'unexpected_successes': len(result.unexpectedSuccesses),
                            'passed': passed}, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PYCODE
      - name: Check tunnel-only operator transaction without services
        shell: bash
        run: |
          python3 -B - <<'PYCODE'
          import sys
          import unittest
          sys.path.insert(0, 'ops')
          suite = unittest.defaultTestLoader.loadTestsFromName('test_frontend_cutover')
          def flatten(group):
              for item in group:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item
          tests = list(flatten(suite))
          ids = [test.id() for test in tests]
          if len(ids) != 28 or len(set(ids)) != 28:
              raise SystemExit('Expected 28 unique operator tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          rejected = (result.failures, result.errors, result.skipped,
                      result.expectedFailures, result.unexpectedSuccesses)
          if result.testsRun != 28 or any(rejected) or not result.wasSuccessful():
              raise SystemExit('Incomplete or non-green operator tests')
          PYCODE
      - name: Strict ACK and source-builder checks with negative gate oracles
        run: python3 -B scripts/run_integrated_source_checks.py
      - name: Verify portable integrated package source without services
        run: python3 -B packaging/run_packaging_checks.py

  license:
    name: License policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify licenses with the latest released checker
        uses: i-pp/license-check-ci@f6f00d79e73562ae7d200abac986b2e9ce72252d
  minimum_ci:
    name: Minimum CI
    needs: [minimum, license]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all minimum checks to succeed
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.minimum.result }}
          LICENSE_RESULT: ${{ needs.license.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          test "$LICENSE_RESULT" = success
